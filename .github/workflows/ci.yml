name: Stage 0 CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      CI: "true"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Playwright browser binary lives in ~/.cache/ms-playwright by default
      # (we no longer pin PLAYWRIGHT_BROWSERS_PATH=0 — that forced install
      # into node_modules and defeated this cache). Key includes the
      # Playwright version pulled into the lockfile so a Playwright upgrade
      # invalidates automatically. ubuntu-latest ships the system libs
      # Chromium needs, so we drop the `--with-deps` apt path that was
      # hanging for >1h on transient apt-mirror stalls.
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: pnpm exec playwright install chromium

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test:unit

      - name: Apply database migrations
        shell: bash
        run: |
          set -euo pipefail
          for migration in packages/db/drizzle/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Playwright smoke
        run: pnpm test:e2e

      - name: Boundary check
        run: pnpm boundaries

      - name: Security check
        run: pnpm security

      - name: Verification gate
        run: pnpm verify
